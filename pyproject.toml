[project]
name = "plumb-rdf"
version = "0.2.0"
description = "Author RDF building models (Brick, 223P, WATR) as plain typed Python"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [
    { name = "Gabe Fierro", email = "gtfierro@mines.edu" }
]
requires-python = ">=3.12"
keywords = [
    "rdf",
    "ontology",
    "shacl",
    "brick",
    "ashrae-223p",
    "watr",
    "building-automation",
    "water-treatment",
    "code-generation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = [
    "ontoenv>=0.5.5",
    "pyshifty>=0.2.6",
    "rdflib>=7.6.0",
    "z3-solver>=5.0.0.0",
]

[project.urls]
Homepage = "https://gtfierro.github.io/plumb/"
Documentation = "https://gtfierro.github.io/plumb/"
Repository = "https://github.com/gtfierro/plumb"
Issues = "https://github.com/gtfierro/plumb/issues"
Changelog = "https://github.com/gtfierro/plumb/blob/main/CHANGELOG.md"

[project.scripts]
plumb = "plumb.cli:main"

[tool.ruff]
line-length = 88
# Generated packages are compiler output; they carry `# ruff: noqa` too.
extend-exclude = ["src/plumb/brick", "src/plumb/s223", "src/plumb/watr"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.11.26,<0.15"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.62",
]
docs = ["jupyter-book>=1.0,<2"]

[tool.uv.build-backend]
module-name = "plumb"
